services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniflow
      POSTGRES_USER: omniflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniflow -d omniflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_VISION: ${INSTALL_VISION:-true}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://omniflow:${POSTGRES_PASSWORD:-omniflow}@db:5432/omniflow
      RELEASES_DIR: /data/releases
    volumes:
      - releases:/data/releases
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Acceso remoto seguro sin IP publica: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api

volumes:
  pgdata:
  releases:
